services:
  - type: web
    name: gentlemans-bar-kasse
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: gentlemans-bar-db
          property: connectionString
      - key: ADMIN_PIN
        sync: false
      - key: BAR_ACCESS_CODE
        sync: false
databases:
  - name: gentlemans-bar-db
    region: frankfurt
    plan: free
    databaseName: gentlemans_bar
    user: gentlemans_bar
    ipAllowList: []
